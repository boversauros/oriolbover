<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Oriol Bover - Software Engineer focused on building products with care for usability and simplicity."
    />

    <title>Oriol Bover</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Oriol Bover",
        "jobTitle": "Software Engineer",
        "description": "Software Engineer focused on building products with care for usability and simplicity",
        "url": "https://www.oriolbover.com",
        "sameAs": ["https://www.linkedin.com/in/oriol-bover/", "https://github.com/boversauros"]
      }
    </script>
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <span class="theme-icon"></span>
    </button>

    <main class="container">
      <header class="header">
        <h1 class="name">Oriol Bover</h1>
        <p class="role">Software Engineer</p>
      </header>

      <section class="intro">
        <p>
          Building products with care for usability and simplicity. Interested in design systems and
          software as a craft.
        </p>
      </section>

      <section class="works">
        <h2 class="section-title">Projects</h2>
        <ul class="project-list">
          <!-- RECENT_WORKS_PLACEHOLDER -->
        </ul>
      </section>

      <footer class="footer">
        <nav class="contact-links">
          <a href="mailto:bover73@gmail.com" class="contact-link">Email</a>
          <a
            href="https://www.linkedin.com/in/oriol-bover/"
            target="_blank"
            rel="noopener noreferrer"
            class="contact-link"
            >LinkedIn</a
          >
          <a
            href="https://github.com/boversauros"
            target="_blank"
            rel="noopener noreferrer"
            class="contact-link"
            >GitHub</a
          >
        </nav>
      </footer>
    </main>

    <script>
      const themeToggle = document.getElementById('themeToggle');
      const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');

      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
      }

      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        setTheme(savedTheme);
      } else if (prefersDarkScheme.matches) {
        setTheme('dark');
      } else {
        setTheme('light');
      }

      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
      });

      prefersDarkScheme.addEventListener('change', (e) => {
        if (!localStorage.getItem('theme')) {
          setTheme(e.matches ? 'dark' : 'light');
        }
      });
    </script>
  </body>
</html>
